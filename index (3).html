<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection Proxiclic Provence</title>
    <style>
        /* Le conteneur qui recouvre toute la page */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease-out; /* Fondu doux d'une seconde et demi */
        }

        .message {
            font-size: 2.5rem;
            color: #333;
            text-align: center;
            font-weight: 300;
            padding: 20px;
        }

        /* Classe ajoutée par JS pour lancer le fondu */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="message">
            Informatique Digne les Bains<br>devient <strong>Proxiclic Provence !</strong>
        </div>
    </div>

    <script>
        // Le script attend le chargement complet de la page pour agir
        window.addEventListener("load", function() {
            const loader = document.getElementById("loader");
            
            // On attend 2 secondes de "lecture" avant de lancer le fondu
            setTimeout(function() {
                loader.classList.add("fade-out");
                
                // Redirection juste après la fin de l'animation de fondu
                setTimeout(function() {
                    window.location.href = "https://proxiclic-provence.fr";
                }, 1500); 
            }, 2000);
        });
    </script>
</body>
</html>
