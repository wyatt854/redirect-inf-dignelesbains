<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxiclic Provence</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* Écran de chargement */

#loader{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        rgba(255,255,255,.15),
        rgba(255,255,255,.15)
    ),
    url('background-proxiclic.webp');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;

    z-index:9999;

    animation:
        backgroundFade 0.9s ease-out forwards;

    transition:opacity 1.5s ease;
}

/* Apparition douce de l'image */

@keyframes backgroundFade{
    from{
        opacity:0;
        transform:scale(1.03);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Cercle */

.loader-circle{
    width:55px;
    height:55px;

    border:5px solid rgba(255,255,255,.35);
    border-top:5px solid #f58220;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:15px;

    backdrop-filter:blur(2px);
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* Texte */

.loading-text{
    color:#ffffff;

    font-size:1rem;

    font-weight:600;

    letter-spacing:.5px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.4);

    margin-bottom:50px;
}

/* Fondu de sortie */

.fade-out{
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="loader">

    <div class="loader-circle"></div>

    <div class="loading-text">
        Redirection vers Proxiclic Provence...
    </div>

</div>

<script>

window.addEventListener("load", function(){

    const loader = document.getElementById("loader");

    setTimeout(function(){

        loader.classList.add("fade-out");

        setTimeout(function(){

            window.location.href =
            "https://proxiclic-provence.fr";

        },1500);

    },2500);

});

</script>

</body>
</html>
